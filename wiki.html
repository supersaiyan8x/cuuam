:root[data-theme="light"] .buf-section>h5,
:root[data-theme="light"] .ng-stat-block h5,
:root[data-theme="light"] .tier-txt{font-size:15px}
:root[data-theme="light"] .ng-points,
:root[data-theme="light"] .ng-stat-grid{font-size:14px}
:root[data-theme="light"] .ng-stat-sub{font-size:13px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button,input,select{font-family:inherit}
.brand,.sticky h2,.cat h3,.card-title h4,.buf-section>h5,.tier-hd,.level-controls label,.topnav .tabs button,.lvl-btn,.level-max,.stamp{font-family:var(--font-title)}
.brand-en{font-family:"Cormorant Garamond",serif;font-size:12px;font-weight:400;letter-spacing:2px;color:var(--gold3);margin-left:2px;opacity:.85}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--panel2)}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--line3)}

/* top nav */
.topnav{height:var(--navh);background:var(--bg);border-bottom:1px solid var(--line2);display:flex;align-items:center;padding:0 16px;gap:18px;position:relative;z-index:50}
.home-link{color:var(--gold);text-decoration:none;font-size:17px;line-height:1;padding:5px 8px;border:1px solid var(--line2);border-radius:4px;background:var(--panel);flex:none}
.home-link:hover{border-color:var(--gold2)}
.calc-link{color:var(--gold2);text-decoration:none;font-size:12px;line-height:1;padding:6px 9px;border:1px solid var(--line2);border-radius:4px;background:var(--panel);flex:none;white-space:nowrap}
.calc-link:hover{border-color:var(--gold2)}
.brand{color:var(--gold2);font-size:20px;font-weight:700;letter-spacing:2px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand .yin{font-size:24px;color:var(--gold)}
.topnav .tabs{display:flex;gap:4px;margin-left:12px}
.topnav .tabs button{background:transparent;border:1px solid transparent;color:var(--dim);padding:7px 14px;cursor:pointer;border-radius:4px;font-size:14px}
.topnav .tabs button.on{color:var(--gold);border-color:var(--line2);background:var(--panel)}
.topnav .spacer{flex:1}
.topnav .hint{color:var(--dim);font-size:12px}
.lang-toggle{display:flex;border:1px solid var(--line2);border-radius:4px;overflow:hidden;flex:none}
.lang-toggle button{background:transparent;border:0;border-right:1px solid var(--line2);color:var(--dim);font-size:11px;padding:4px 8px;cursor:pointer;font-family:var(--font-title)}
.lang-toggle button:last-child{border-right:0}
.lang-toggle button.on{background:var(--panel);color:var(--gold)}
.theme-toggle{background:transparent;border:1px solid var(--line2);color:var(--gold2);border-radius:4px;padding:5px 9px;cursor:pointer;font-size:13px;font-weight:600;line-height:1;white-space:nowrap;flex:none}
.theme-toggle:hover{background:var(--panel);color:var(--gold)}

/* layout */
.layout{display:flex;height:calc(100% - var(--navh))}
.pane{height:100%;overflow-y:auto;overflow-x:hidden}
.sidebar{width:230px;flex:none;background:var(--panel2);border-right:1px solid var(--line2)}
.midbar{width:300px;flex:none;background:var(--panel2);border-right:1px solid var(--line2);display:flex;flex-direction:column;overflow:hidden}
.content{flex:1;min-width:0;background:var(--bg);padding:0}
.sticky{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line2);padding:14px}
.sticky h2{margin:0 0 10px;color:var(--gold2);font-size:17px;letter-spacing:1px}
.wuxia-search{width:100%;background:var(--panel);border:1px solid var(--line2);color:var(--gold2);padding:8px 10px;border-radius:4px;outline:none;font-size:13px}
.wuxia-search:focus{border-color:var(--gold2)}

/* sidebar: name-only catalog */
img{-webkit-user-drag:none;user-select:none}
.cat{border-bottom:1px solid var(--line)}
.cat h3{margin:0;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;color:var(--gold3);font-size:14px;cursor:pointer;user-select:none}
.cat h3:hover{background:var(--panel)}
.cat h3 .arw{color:var(--dim);font-size:11px;transition:transform .2s}
.cat.open h3 .arw{transform:rotate(90deg)}
.cat .sub{display:none;padding:4px 0 8px}
.cat.open .sub{display:block}
.cat .sub div{padding:6px 14px 6px 24px;font-size:13px;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;gap:8px;min-width:0}
.cat .sub div:hover{background:var(--hover);color:var(--gold)}
.cat .sub div.on{color:var(--gold);background:var(--hover)}
.cat .sub div b{font-weight:400;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat .sub div span{color:var(--dim);font-size:11px;white-space:nowrap}

/* middle catalog: icon + name */
.midlist{flex:1;overflow-y:auto}
.miditem{height:65px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 14px;cursor:pointer;gap:10px}
.miditem:hover{background:var(--panel)}
.miditem.on{background:var(--hover);border-left:3px solid var(--gold);padding-left:11px}
.miditem img{width:42px;height:42px;object-fit:cover;border-radius:6px;background:var(--imgbg);flex:none;border:1px solid var(--line2)}
.miditem.jm-point img{object-fit:contain;background:#0d0a07;border-color:rgba(255,217,122,.35)}
.miditem.jm-point.is-open .nm b{color:var(--gold)}
.miditem.jm-meridian img{object-fit:contain;background:#0d0a07;border-color:rgba(255,217,122,.35)}
.miditem .nm{flex:1;min-width:0}
.miditem .nm b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.miditem .nm small{display:block;color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stamp{font-size:11px;color:var(--gold3);border:1px solid var(--line2);border-radius:3px;padding:2px 6px;white-space:nowrap}

/* content */
.c{min-height:100%;padding:20px 26px 80px}
.back{display:none;background:transparent;border:0;color:var(--gold2);cursor:pointer;margin-bottom:10px;font-size:13px}
.wuxia-header-box{position:relative;border:1px solid var(--line2);border-radius:8px;padding:22px;background:linear-gradient(180deg,var(--panel),var(--panel2));margin-bottom:18px;overflow:hidden}
.stamp-watermark{position:absolute;right:18px;top:18px;font-size:34px;color:var(--watermark);font-weight:700;pointer-events:none;transform:rotate(-8deg)}
.header-title-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.avatar{width:76px;height:76px;border:2px solid var(--gold);border-radius:12px;padding:2px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 0 12px var(--glow)}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:8px}
.header-title-row h2{margin:0;color:var(--gold);font-size:24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.badge-origin{font-size:12px;background:linear-gradient(135deg,#ff4757,#ff6b81);color:#fff;padding:4px 10px;border-radius:4px;border:1px solid rgba(255,255,255,.35);font-family:sans-serif}
.elem-line{text-align:center;margin:10px 0 6px;font-size:13px}
.elem-line strong{color:var(--dim)}
.wuxia-meta{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;margin:6px 0 0;font-size:13px}
.wuxia-meta strong{color:var(--gold3)}

.level-controls{display:flex;align-items:center;justify-content:center;gap:8px;margin:18px 0;flex-wrap:wrap}
.level-controls label{color:var(--gold3);margin-right:4px}
.lvl-range{flex:1 1 220px;max-width:280px;accent-color:var(--gold2);cursor:pointer;height:4px}
.dmg-sub{color:var(--dim);font-size:12px;margin-left:8px;line-height:1.9}
.lvl-btn{background:var(--panel);border:1px solid var(--line2);color:var(--gold2);width:32px;height:30px;cursor:pointer;border-radius:4px}
.lvl-btn:disabled{opacity:.35;cursor:default}
.level-input{width:56px;background:var(--panel);border:1px solid var(--line2);color:var(--gold);text-align:center;padding:5px;border-radius:4px}
.level-max{color:var(--dim)}

.wuxia-card{position:relative;border:1px solid var(--line2);border-radius:8px;background:linear-gradient(180deg,var(--panel),var(--panel2));padding:24px;margin-top:8px}
.ornament{position:absolute;width:14px;height:14px;border-color:var(--gold2);border-style:solid;opacity:.55}
.ornament.tl{top:6px;left:6px;border-width:2px 0 0 2px}
.ornament.tr{top:6px;right:6px;border-width:2px 2px 0 0}
.ornament.bl{bottom:6px;left:6px;border-width:0 0 2px 2px}
.ornament.br{bottom:6px;right:6px;border-width:0 2px 2px 0}
.card-title{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line2);padding-bottom:14px;margin-bottom:18px}
.card-title h4{margin:0;color:var(--gold);font-size:21px}
.card-title .cost{color:var(--dim);font-size:13px;font-style:italic}
.buffer-box{border-left:3px solid var(--gold2);padding-left:14px;margin-bottom:18px}
.buffer-box h5{color:var(--gold2);margin:0 0 10px;letter-spacing:1px;font-size:14px}
.ng-stat-block{border-left:3px solid var(--gold2);padding-left:14px;margin-bottom:18px}
.ng-stat-block h5{color:var(--gold2);margin:0 0 10px;letter-spacing:1px;font-size:14px}
.ng-points{color:var(--dim);font-size:13px;margin:0 0 8px}
.ng-points b{color:var(--gold3);font-weight:400}
.ng-stat-sub{color:var(--gold3);font-size:12px;margin:10px 0 5px}
.ng-stat-grid{display:flex;flex-direction:column;gap:5px;max-width:560px;text-align:left;font-size:13px}
.ng-stat-cell{display:flex;align-items:baseline;justify-content:space-between;gap:12px;min-width:0;padding:6px 9px;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
.ng-stat-grid .k{color:var(--dim);font-size:12px;white-space:normal;overflow-wrap:anywhere}
.ng-stat-grid .v{color:var(--gold);font-weight:700;font-family:var(--font-title);white-space:nowrap;flex:none}
.tier{padding:13px 18px 13px 14px;border-left:3px solid transparent;border-radius:0 4px 4px 0;cursor:pointer;transition:.25s;margin-bottom:6px;background:transparent;opacity:.38}
.tier.on{opacity:1;border-left-color:var(--gold);background:var(--gold-tint)}
.tier-hd{color:var(--dim);font-size:13px;font-weight:700;margin-bottom:7px}
.tier.on .tier-hd{color:var(--gold)}
.tier-hd em{color:var(--bright);font-style:normal;margin-left:6px;font-size:12px}
.tier-txt{color:var(--ink);font-size:14px;line-height:1.8;word-break:break-word;white-space:pre-wrap}
.tier-txt .dmg{color:var(--gold);font-weight:700}
.tier-txt .red{color:var(--red);font-weight:700}
.tier-txt .cyan{color:var(--cyan);font-weight:700}
.tier-txt .green{color:var(--green);font-weight:700}
.tier-txt .mag{color:var(--purple);font-weight:700}
.tier-txt .pur{color:var(--purple);font-weight:700}
.tier-txt .lbl{color:var(--cyan);font-weight:700}

.statline{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line2);font-size:12px;color:var(--dim)}
.statline b{color:var(--gold3);font-weight:400}
.stat-toggle{margin-top:14px;background:transparent;border:1px solid var(--line2);color:var(--gold2);padding:6px 12px;border-radius:4px;cursor:pointer;font-size:12px}
.stat-toggle:hover{border-color:var(--gold2);color:var(--gold)}
.stat-detail{margin-top:10px}
.stat-detail[hidden]{display:none}
.info-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px;padding:12px 14px;margin-top:14px;border:1px solid var(--line2);border-radius:4px;font-size:12px}
.info-grid span{color:var(--dim)}
.info-grid b{color:var(--gold3);font-weight:400}
.info-grid .full{grid-column:1/-1}
.hit-strip{display:flex;gap:18px;flex-wrap:wrap;padding:10px 14px;margin-top:12px;background:linear-gradient(135deg,var(--hover),var(--panel2));border:1px solid var(--gold2);border-radius:4px;font-size:12px;color:var(--gold2)}
.hit-strip b{color:var(--gold);font-weight:500}
.bonus-summary{margin-top:10px;padding:10px 14px;border:1px solid var(--line2);border-radius:4px;background:var(--panel2);font-size:12px}
.bs-title{color:var(--gold2);margin-bottom:7px}
.bs-list{display:flex;flex-wrap:wrap;gap:6px 14px}
.bs-item{color:var(--dim)}
.bs-item b{font-weight:600;color:var(--gold3)}
.bs-item b.yellow{color:var(--yellow)}.bs-item b.red{color:var(--red)}.bs-item b.cyan{color:var(--cyan)}
.bs-item b.green{color:var(--green)}.bs-item b.mag{color:var(--purple)}.bs-item b.pur{color:var(--purple)}
.bonus-btn{margin-top:14px;margin-right:8px;background:linear-gradient(135deg,var(--btn2),var(--btn));border:1px solid var(--gold2);color:var(--gold);padding:6px 12px;border-radius:4px;cursor:pointer;font-size:12px}
.bonus-btn:hover{background:linear-gradient(135deg,var(--btn2h),var(--btnh))}
.bonus-mask{position:fixed;inset:0;background:var(--mask);z-index:999;display:flex;align-items:center;justify-content:center;padding:16px}
.bonus-mask[hidden]{display:none}
.bonus-panel{width:min(520px,100%);max-height:92vh;overflow:auto;background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--gold2);border-radius:8px;padding:18px;box-shadow:0 12px 48px var(--shadow);font-size:13px}
.bonus-panel h3{margin:0 0 6px;color:var(--gold);font-size:16px;font-weight:500}
.bonus-panel .hint{color:var(--dim);font-size:11px;margin-bottom:14px}
.bonus-panel label{display:block;margin:10px 0 4px;color:var(--gold2);font-size:12px}
.bonus-panel input,.bonus-panel select{width:100%;box-sizing:border-box;background:var(--input);border:1px solid var(--line2);border-radius:4px;color:var(--gold3);padding:7px 9px;font-size:13px;outline:none}
.bonus-panel input:focus,.bonus-panel select:focus{border-color:var(--gold2)}
.bonus-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bonus-result{margin-top:16px;padding:12px;border:1px dashed var(--gold2);border-radius:4px;line-height:1.9}
.bonus-result b{color:var(--gold)}
.bonus-result .red{color:var(--red)}.bonus-result .cyan{color:var(--cyan)}.bonus-result .green{color:var(--green)}.bonus-result .mag{color:var(--purple)}.bonus-result .yellow{color:var(--yellow)}
.bonus-actions{display:flex;gap:8px;margin-top:16px}
.bonus-actions button{flex:1;padding:8px;border-radius:4px;cursor:pointer;font-size:12px;border:1px solid var(--gold2);background:linear-gradient(135deg,var(--btn2),var(--btn));color:var(--gold)}
.bonus-actions button:nth-child(2){background:transparent;color:var(--dim);border-color:var(--line2)}
.bonus-actions button:nth-child(3){background:transparent;color:var(--dim);border-color:var(--line2)}
.cmp-link{cursor:pointer;font-family:inherit}
.cmp-mask{position:fixed;inset:0;background:var(--mask);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
.cmp-mask[hidden]{display:none}
.cmp-panel{width:min(1120px,100%);max-height:92vh;overflow:auto;background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--gold2);border-radius:8px;padding:18px;box-shadow:0 12px 48px var(--shadow);font-size:13px}
.cmp-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.cmp-head h3{margin:0;color:var(--gold);font-size:17px;font-weight:500}
.cmp-close{background:transparent;border:1px solid var(--line2);color:var(--gold2);border-radius:4px;padding:5px 9px;cursor:pointer}
.cmp-pickers{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cmp-picker{min-width:0;padding:12px;border:1px solid var(--line2);border-radius:6px;background:var(--panel2)}
.cmp-picker-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.cmp-picker-hd b{color:var(--gold);font-size:14px}
.cmp-picker-hd .cmp-picked{color:var(--gold2);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:70%}
.cmp-picker input.wuxia-search{width:100%;box-sizing:border-box;margin:0 0 8px}
.cmp-picker-cols{display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:8px;height:230px}
.cmp-setlist,.cmp-movelist{overflow:auto;border:1px solid var(--line2);border-radius:4px;background:var(--panel)}
.cmp-cat{position:sticky;top:0;display:flex;align-items:center;gap:6px;padding:6px 8px;color:var(--gold3);font-size:12px;background:var(--panel2);border-bottom:1px solid var(--line2);z-index:1;cursor:pointer;user-select:none}
.cmp-cat .arw{font-size:9px;color:var(--gold2);transition:transform .15s}
.cmp-cat.open .arw{transform:rotate(90deg)}
.cmp-set,.cmp-move{padding:6px 8px;font-size:12px;color:var(--ink);cursor:pointer;border-bottom:1px solid var(--line)}
.cmp-set:hover,.cmp-move:hover{color:var(--gold);background:var(--gold-tint)}
.cmp-set.on,.cmp-move.on{color:var(--gold);background:var(--gold-tint);font-weight:600}
.cmp-move{display:flex;align-items:center;gap:6px}
.cmp-move img{width:22px;height:22px;object-fit:cover;border-radius:3px;border:1px solid var(--line2);background:var(--imgbg);flex:none}
.cmp-move span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmp-lvrow{display:flex;align-items:center;gap:8px;margin-top:10px;padding:8px;border:1px solid var(--line2);border-radius:4px;background:var(--tint)}
.cmp-lvrow label{color:var(--gold3);font-size:12px;flex:none;margin:0}
.cmp-lvrow select{flex:1;min-width:0;background:var(--input);border:1px solid var(--line2);border-radius:4px;color:var(--gold3);padding:6px 8px;font-size:12px;outline:none}
.cmp-lvrow select:focus{border-color:var(--gold2)}
.cmp-tools{display:flex;gap:8px;margin:14px 0}
.cmp-tools button{background:linear-gradient(135deg,var(--btn2),var(--btn));border:1px solid var(--gold2);color:var(--gold);padding:7px 12px;border-radius:4px;cursor:pointer;font-size:12px}
.cmp-tools button.plain{background:transparent;color:var(--dim);border-color:var(--line2)}
.cmp-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.cmp-card{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line2);border-radius:6px;background:var(--panel)}
.cmp-card img{width:44px;height:44px;object-fit:cover;border-radius:5px;border:1px solid var(--line2);background:var(--imgbg)}
.cmp-card>div{min-width:0}
.cmp-card b{display:block;color:var(--gold2);font-size:14px}
.cmp-card small{color:var(--dim)}
.cmp-table .cmp-dmg-sum{display:flex;flex-wrap:wrap;gap:2px 10px;line-height:1.6;color:var(--dim)}
.cmp-table .cmp-dmg-sum b{color:var(--gold2)}
.cmp-table .cmp-dmg-sum .dmg{color:var(--red)}
.cmp-table-wrap{overflow-x:auto;border:1px solid var(--line2);border-radius:6px}
.cmp-table{width:100%;min-width:620px;border-collapse:collapse;font-size:12px}
.cmp-table th,.cmp-table td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cmp-table th{position:sticky;top:0;background:var(--panel2);color:var(--gold3);font-weight:600;z-index:1}
.cmp-table td:first-child{width:110px;color:var(--dim)}
.cmp-table td:nth-child(2),.cmp-table td:nth-child(3){width:32%}
.cmp-table .up{color:var(--green)}.cmp-table .down{color:var(--red)}.cmp-table .same{color:var(--dim)}
.cmp-empty{padding:46px;text-align:center;color:var(--dim);border:1px dashed var(--line2);border-radius:6px}
/* Kinh mạch: rebuilt from form_wuxue_jingmai.xml and the wuxue_new/jingmai art.
   Geometry follows the 1094x692 game form; the art stays dark in both themes. */
.jm-summary{margin-bottom:16px}
.jm-game{--jm-ink:#f7ecd7;--jm-dim:#cbb78f;--jm-gold:#ffd97a;width:min(100%,899px);margin:0 auto;color:var(--jm-ink)}
.jm-stage{position:relative;width:100%;aspect-ratio:899/637;overflow:hidden;border:1px solid #5a4425;border-radius:6px;background:#0d0a07;box-shadow:0 8px 30px rgba(0,0,0,.45);font-size:clamp(7px,1.18vw,13px)}
.jm-stage button{background:none;border:0;padding:0;cursor:pointer;color:inherit;font:inherit}
.jm-stage button:focus-visible{outline:2px solid var(--jm-gold);outline-offset:2px}

// Data bundles are delivered as obfuscated, gzip-compressed JavaScript chunks.
// The browser still needs the bytes to render, but there are no plain JSON URLs
// to download and the payload is useless without this decoder.
const WX_KEY='wuxue-codex-2026-ao';
async function wxDecode(b64,name){
  const bin=atob(b64),u=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i)^WX_KEY.charCodeAt(i%WX_KEY.length);
  const raw=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));
  const obj=JSON.parse(await new Response(raw).text());
  try{window['__WX_'+name]=null;}catch(e){}
  return obj;
}
function wxLoad(name){
  return new Promise((res,rej)=>{
    if(window['__WX_'+name]!=null) return res(window['__WX_'+name]);
    const s=document.createElement('script');
    s.src='wx-'+name+'.js';s.async=true;
    s.onload=()=>{const v=window['__WX_'+name];if(v==null)rej(Error('Thiếu dữ liệu '+name));else res(v);};
    s.onerror=()=>rej(Error('Không tải được '+name));
    document.head.appendChild(s);
  });
}
// Deter saved copies / drag-off, while still allowing text selection and Ctrl+C.
if(location.protocol==='http:'||location.protocol==='https:'){

    const k=String(e.key||'').toLowerCase(),mod=e.ctrlKey||e.metaKey;

    if(e.key==='F12'||(mod&&e.shiftKey&&(k==='i'||k==='j'||k==='c')))e.preventDefault();
  });
}
function applyTheme(){

const L=k=>UI[lang][k];
const CJK=/[\u3400-\u9fff]/;
const has=(v,q)=>String(v==null?'':v).toLowerCase().includes(q);

// Read the active-language value while keeping the original Chinese in *0 fields.
function F(o,key){
  if(!o) return '';
  if(key==='dt') return lang==='vi' ? (o.dtv||o.dt||'') : (o.dt||'');
  const v = lang==='vi' ? o[key] : (o[key+'0']==null?o[key]:o[key+'0']);
  return v==null?'':v;
}
// Display name = translated/original move name + variant tags (biến chiêu / võ kỹ / trên không)
function MN(o){ return o ? (F(o,'dn')||F(o,'n')) : ''; }
function CV(v){
  v=String(v==null?'':v);
  return lang==='vi' && CJK.test(v) ? (I18N.targets[v]||v) : v;
}
const EN_ZH={BufferID:'效果ID',BufferLevel:'效果等级',DexAdd:'身法',IngAdd:'内息',

 PhyDefAdd:'外功防御',SpiAdd:'罡气',StaAdd:'体魄',StrAdd:'臂力',WearCondition:'装备条件'};
const STAT_HIDE=new Set(['BufferID','BufferLevel','WearCondition','PhyDefAdd']);
function STATLABEL(k){
  if(!k) return '';
  return lang==='vi' ? (I18N.stats[k]||k) : (EN_ZH[k]||k);
}
function schoolName(s){
  const v=lang==='vi' ? (s.sch||s.sch0||'') : (s.sch0||s.sch||'');
  return String(v||'').replace(/^(归属：|Thuộc:\s*)/,'');
}
function canonGroup(s){ return s.g0||s.c0||s.g||s.c||''; }
function groupLabel(s){ return lang==='vi' ? (s.g||s.c||s.g0||'') : (s.g0||s.c0||s.g||''); }

function applyStatic(){
  document.documentElement.lang = lang==='vi'?'vi':'zh-CN';
  document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=L(e.dataset.i18n));
  document.querySelectorAll('.topnav .tabs button').forEach(b=>b.textContent=L('types')[b.dataset.t]);
  const qm=document.getElementById('qmid'); if(qm)qm.placeholder=L('nameSearch');
  document.querySelectorAll('#langToggle button').forEach(b=>b.classList.toggle('on',b.dataset.lang===lang));
  const tb=document.getElementById('themeToggle'); if(tb) tb.title=L('theme');
}

function allGroups(){
  const g={};SK.filter(s=>s.t===curType).forEach(s=>{(g[canonGroup(s)] ||= []).push(s);});return g;
}
function resetCats(){
  const first=Object.keys(allGroups())[0]||'';
  openGroups=new Set(first?[first]:[]);
}

function toggleCats(on){
  const s=document.getElementById('sidebar'),m=document.getElementById('catMask');
  if(!s||!m)return;
  s.classList.toggle('open',!!on);m.classList.toggle('on',!!on);
}
function catRowAttrs(o,name,extra){
  return ' data-n0="'+esc(o.n0==null?name:o.n0)+'" data-n="'+esc(name)+'" data-ty="'+esc(extra||'')+'"';
}
function renderCats(keepScroll=false, forceQ=null){
  const el=document.getElementById('sidebar');
  const scroll=keepScroll?el.scrollTop:0;
  const qval=forceQ==null?sidebarQuery:forceQ;
  sidebarQuery=qval;
  const sticky='<div class="sticky"><div class="title-row"><h2>'+esc(L('library'))+'</h2><button class="cat-close" onclick="toggleCats(false)">'+esc(L('closeCats'))+'</button></div><input class="wuxia-search" id="qcat" value="'+esc(qval)+'" placeholder="'+esc(L('catSearch'))+'"></div>';
  const groups=allGroups();
  el.innerHTML=sticky+Object.entries(groups).map(([g,arr])=>{
    const label=groupLabel(arr[0]);
    return '<div class="cat '+(openGroups.has(g)?'open':'')+'" data-g="'+esc(g)+'" data-gv="'+esc(label)+'"><h3><span>☯ '+esc(label)+'</span><span class="arw">▶</span></h3><div class="sub">'+
      arr.map(s=>{
        const c=F(s,'c'),sub=[F(s,'g')||c,s.m?L('moves')(s.m.length):''].filter(Boolean).join(' · ');
        return '<div class="cat-row '+(curSet&&curSet.k===s.k?'on':'')+'" data-k="'+s.k+'"'+catRowAttrs(s,F(s,'n'),sub)+'><b>'+esc(F(s,'n'))+'</b></div>';
      }).join('')+'</div></div>';
  }).join('');
  el.querySelectorAll('.cat h3').forEach(h=>h.onclick=()=>{
    const cat=h.parentElement;cat.classList.toggle('open');
    if(cat.classList.contains('open'))openGroups.add(cat.dataset.g);else openGroups.delete(cat.dataset.g);
  });
  el.querySelectorAll('.cat .sub .cat-row').forEach(d=>d.onclick=()=>{
    openSet(+d.dataset.k);toggleCats(false);
  });
  const q=document.getElementById('qcat');
  const filter=v=>{
    el.querySelectorAll('.cat').forEach(c=>{
      let show=false;
      c.querySelectorAll('.cat-row').forEach(d=>{
        const hit=has(d.textContent,v)||has(d.dataset.n,v)||has(d.dataset.n0,v);
        d.style.display=hit?'':'none';if(hit)show=true;
      });
      const ghit=has(c.dataset.g,v)||has(c.dataset.gv,v);
      c.style.display=show||ghit?'':'none';
      if(v&&(show||ghit))c.classList.add('open');
    });
  };
  q.oninput=()=>{sidebarQuery=q.value.toLowerCase();filter(sidebarQuery);};
  if(qval)filter(qval.toLowerCase());
  el.scrollTop=scroll;
}

function jmMidList(s){
  const max=Math.max(1,(s.lv||[]).length), key=jmArtKey(s), ni=jmIsNi(s), a=s.a;
  const names=JM_POINT_NAMES[a]||[];
  const pts=JM_PATHS[key+(ni?'_n':'')]||JM_PATHS[key]||[];
  const n=names.length||pts.length||5;
  const open=jmOpenCount(curLevel,n,max);
  return Array.from({length:n},(_,i)=>{
    const isOpen=i<open;
    const name=jmPointName(a,i);
    const sub=(isOpen?L('jmOpen'):L('jmClosed'))+' · '+L('jmLevel')+' '+jmNodeNeed(i,n,max);
    return {i:i, name:name, sub:sub, stamp:sub, isOpen:isOpen,
      icon:'/jingmai/nw-'+key+'-'+(isOpen?'open-'+(ni?'n':'z'):'close')+'.png',
      search:[name,sub,F(s,'n'),s.n0].join(' ')};
  });
}

        search:[F(curSet,'n'),curSet.n0,F(curSet,'c'),curSet.c0].join(' ')}];
    }
  } else if(curType==='jingmai'&&(previewSet=SK.find(s=>s.t==='jingmai'&&JM_POINT_NAMES[s.a]))){
    mode='jmset';
    list=[{s:previewSet, icon:previewSet.i, name:F(previewSet,'n'),

      stamp:F(s,'c'), search:[F(s,'n'),s.n0,F(s,'c'),s.c0,groupLabel(s)].join(' ')}));

  if(mode==='jmset'){
    box.innerHTML=info+list.map(x=>'<div class="miditem jm-meridian'+(curSet&&curSet.k===x.s.k?' on':'')+'" data-k="'+x.s.k+'">'+img(x.icon)+'<div class="nm"><b>'+esc(x.name)+'</b></div></div>').join('');
    box.querySelectorAll('[data-k]').forEach(x=>x.onclick=()=>{openSet(+x.dataset.k);openContent();toggleCats(false);});
  } else if(mode==='jm'){
    box.innerHTML=info+list.map(x=>'<div class="miditem jm-point'+(x.isOpen?' is-open':'')+'" data-jm-point="'+x.i+'" title="'+esc(x.name+' · '+x.sub)+'"><img src="'+esc(x.icon)+'" alt=""><div class="nm"><b>'+esc(x.name)+'</b><small>'+esc(x.sub)+'</small></div></div>').join('');
    box.querySelectorAll('[data-jm-point]').forEach(x=>x.onclick=()=>{
      if(previewSet&&!curSet) openSet(previewSet.k); else renderContent();
      openContent();toggleCats(false);
    });
  } else if(curSet){
    box.innerHTML=info+list.map(x=>'<div class="miditem '+(mode==='move'&&x.i===curMove?'on':'')+'" data-mv="'+x.i+'">'+img(x.icon)+'<div class="nm"><b>'+esc(x.name)+'</b><small>'+esc(x.sub)+'</small></div>'+(x.stamp?'<span class="stamp">'+esc(x.stamp)+'</span>':'')+'</div>').join('');
    box.querySelectorAll('[data-mv]').forEach(x=>x.onclick=()=>{
      curMove=+x.dataset.mv;curLevel=1;renderMid(true);renderContent();openContent();toggleCats(false);
    });
  } else {
    box.innerHTML=list.map(x=>'<div class="miditem" data-k="'+x.s.k+'">'+img(x.icon)+'<div class="nm"><b>'+esc(x.name)+'</b><small>'+esc(x.sub)+'</small></div>'+(x.stamp?'<span class="stamp">'+esc(x.stamp)+'</span>':'')+'</div>').join('');
    box.querySelectorAll('[data-k]').forEach(x=>x.onclick=()=>openSet(+x.dataset.k));
  }
  box.scrollTop=scroll;
}

const isMobile=()=>window.matchMedia('(max-width:820px)').matches;
function openSet(k,keepLevel){

    curLevel=Number(keepLevel)>0?Math.max(1,Math.min(keepLevel,(curSet.lv||[]).length||1)):1;

function cmpCandidates(){
  if(cmpList) return cmpList;
  cmpList=[];cmpByKey={};
  SK.forEach(s=>{
    if(cmpMode!=='move'){
      if(s.t!==(cmpMode==='ng'?'neigong':'jingmai'))return;
      const c={s:s,m:null,si:s.k,mi:0,lv:1};
      cmpList.push(c);cmpByKey[s.k+':0']=c;
      return;
    }
    if(s.t!=='wuxue'||!s.m) return;
    s.m.forEach((m,mi)=>{
      const c={s:s,m:m,si:s.k,mi:mi,lv:1};
      cmpList.push(c);cmpByKey[s.k+':'+mi]=c;
    });
  });
  return cmpList;
}
function cmpFind(si,mi,lv){
  cmpCandidates();
  const c=cmpByKey[si+':'+mi]||null;
  if(c)c.lv=lv||1;
  return c;
}
function cmpSetGroups(){
  const g={};
  SK.filter(s=>cmpMode==='ng'?s.t==='neigong':(cmpMode==='jm'?s.t==='jingmai':(s.t==='wuxue'&&s.m&&s.m.length))).forEach(s=>{
    const k=canonGroup(s);
    if(!g[k])g[k]={label:groupLabel(s),sets:[]};
    g[k].sets.push(s);
  });
  return g;
}
function cmpFirstSet(){

function cmpLevelRows(c){

function cmpJmStatKeys(){

  const keys=[];
  SK.filter(s=>s.t==='jingmai').forEach(s=>(s.lv||[]).forEach(l=>{
    Object.keys(neiStatMap(l.st)).forEach(k=>{if(keys.indexOf(k)<0)keys.push(k);});

  cmpJmKeyList=keys;return keys;

function cmpDiff(a,b){

function cmpRenderSetList(slot,expandMatches=false){
  const box=document.getElementById('cmpSet'+slot);
  if(!box)return;
  const scroll=box.scrollTop,q=cmpUI[slot].q.toLowerCase();
  let html='';
  const groups=cmpSetGroups();
  if(cmpMode!=='move'){
    Object.entries(groups).forEach(([gk,g])=>{
      const hit=g.sets.some(s=>!q||has(g.label,q)||has(F(s,'n'),q)||has(s.n0,q)||has(F(s,'c'),q)||has(s.c0,q));
      if(!hit)return;
      html+='<div class="cmp-set'+(cmpUI[slot].set===gk?' on':'')+'" data-g="'+esc(gk)+'" title="'+esc(g.label)+'">'+esc(g.label)+'</div>';
    });
    box.innerHTML=html||'<div class="cmp-cat">'+esc(L(cmpMode==='jm'?'compareJmNoSet':'compareNgNoSet'))+'</div>';
    box.querySelectorAll('.cmp-set[data-g]').forEach(d=>d.onclick=()=>{cmpUI[slot].set=d.dataset.g;cmpFill();});
    box.scrollTop=scroll;
    return;
  }
  Object.entries(groups).forEach(([gk,g])=>{
    const sets=g.sets.filter(s=>!q||has(g.label,q)||has(F(s,'n'),q)||has(s.n0,q)||has(F(s,'c'),q)||has(s.c0,q));
    if(!sets.length)return;
    if(expandMatches&&q)cmpOpenGroups[slot].add(gk);
    const open=cmpOpenGroups[slot].has(gk);
    html+='<div class="cmp-cat'+(open?' open':'')+'" data-g="'+esc(gk)+'"><span class="arw">▶</span>'+esc(g.label)+'</div>';
    if(open)sets.forEach(s=>{
      const c=F(s,'c');
      html+='<div class="cmp-set'+(cmpUI[slot].set===s.k?' on':'')+'" data-k="'+s.k+'" title="'+esc(F(s,'n'))+'">'+
        esc(F(s,'n'))+(c?'<span style="color:var(--dim)"> · '+esc(c)+'</span>':'')+'</div>';
    });
  });
  box.innerHTML=html||'<div class="cmp-cat">'+esc(L('compareNoMove'))+'</div>';
  box.querySelectorAll('.cmp-cat[data-g]').forEach(h=>h.onclick=()=>{
    const g=h.dataset.g;

const BINGLU=[0,5,8,11,17,26,38,58,86,130,194,244,295,347,400,454];
const NGPICK=[0,16,20];

const BONUS_DEFAULT={MinMeleeDamage:0,MaxMeleeDamage:0,MeleePower:0,MagicPower:0,ShotPower:0,binglu:0,
  ngadd:0,zbadd:0,bwadd:0,bjadd:0,jnadd:0,txadd:0};
const BONUS_KEYS=Object.keys(BONUS_DEFAULT);
function loadBonus(){
  try{const v=JSON.parse(localStorage.getItem('wx_bonus')||'null');
      return v?Object.assign({},BONUS_DEFAULT,v):Object.assign({},BONUS_DEFAULT);}
  catch(e){return Object.assign({},BONUS_DEFAULT);}
}
function saveBonus(b){try{localStorage.setItem('wx_bonus',JSON.stringify(b));}catch(e){}}
function readBonusForm(mask){
  const b=loadBonus();
  BONUS_KEYS.forEach(k=>{const el=mask.querySelector('#b_'+k);if(el)b[k]=el.value;});
  // the ng select stores an index; the mini app stores the picker VALUE (0/16/20)
  b.ngadd=NGPICK[Math.min(Math.max(0,+b.ngadd||0),NGPICK.length-1)];
  return b;
}
function calcBonus(lv,b){
  if(!lv||!((lv.sa&&lv.sa.length)||lv.at)) return null;
  const db=Number(lv.db)||0, dm=Number(lv.dm)||0, cf=Number(lv.cf)||0, hp=Math.max(1,Number(lv.hp)||1);
  const rate=dm*cf;
  const attrs=lv.sa&&lv.sa.length?lv.sa:String(lv.at||'').split(/\s*\/\s*/);
  const parts=[]; let item=0;
  attrs.forEach(a=>{
    const k=a==='MeleePower'?'MeleePower':a==='MagicPower'?'MagicPower':a==='ShotPower'?'ShotPower':'';
    if(!k) return;
    const raw=rate*(+b[k]||0); item+=raw;
    const cls=k==='MeleePower'?'red':k==='MagicPower'?'cyan':'green';
    parts.push('<span class="'+cls+'">(+'+Math.floor(raw)+')</span>');
  });
  const bl=BINGLU[Math.min(Math.max(0,+b.binglu||0),BINGLU.length-1)]||0;
  parts.push('<span class="mag">(+'+bl+')</span>');
  const minBase=db+(+b.MinMeleeDamage||0), maxBase=db+(+b.MaxMeleeDamage||0);
  const avg=Math.floor(((minBase+maxBase)/2+item+bl)/hp);
  const ng=(+b.ngadd||0)/100, zb=(+b.zbadd||0)/10, bw=(+b.bwadd||0),
        bj=(+b.bjadd||0)/100, jn=(+b.jnadd||0)/100, tx=(+b.txadd||0)/100;
  const h=(e,crit)=>Math.floor((e*(1+ng)*(1+zb+jn)*(1+tx)*(1+(crit?bj+1:0))+bl)/hp+bw);
  return {parts:parts.join(''),minBase,maxBase,min:h(item+minBase,false),max:h(item+maxBase,false),
    bmin:h(item+minBase,true),bmax:h(item+maxBase,true),avg,hits:hp};
}

  if(!txt) return '';

    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  s=s.replace(/&lt;span style="color:([^"]+)"+&gt;/gi,'<span style="color:$1">')
     .replace(/&lt;span color="([^"]+)"+&gt;/gi,'<span style="color:$1">')
     .replace(/&lt;font color="([^"]+)"+&gt;/gi,'<font color="$1">')
     .replace(/&lt;\/(span|font)&gt;/gi,'</$1>')

function ngBufForLevel(s, lv){
  const list=(s&&s.buf)||[];
  if(!list.length)return '';
  const bm=/(?:^|;\s*)BufferLevel=(\d+)/.exec((lv&&lv.st)||'');
  const bl=bm?+bm[1]:null;
  const exact=bl==null?null:list.find(b=>b[0]===bl);

  const n=Number(lv&&lv.n)||0;

    const num=r?esc(STATLABEL(r.k))+' '+esc(r.v):label;
    return '<div class="jm-bar-row'+(i===0?' active':'')+'" data-jm-el="'+el+'" style="top:'+top+'%"'+
      ' title="'+label+'">'+
      '<i class="jm-bar-icon" style="background-image:url(\'/jingmai/lg-'+el+'.png\')"></i>'+
      '<div class="jm-bar-track"><div class="jm-bar-fill" style="--jm-fill:'+pct+'%;background-image:url(\'/jingmai/pgbar-'+el+'.png\')"></div></div>'+
      '<i class="jm-bar-hl"></i>'+
      '<span class="jm-bar-num">'+num+'</span></div>';
  }).join('');
}
function jmSkillHtml(){
  const per=6,pages=Math.max(1,Math.ceil(jmStats.length/per));
  jmPage=Math.max(1,Math.min(jmPage,pages));
  const rows=jmStats.slice((jmPage-1)*per,jmPage*per);
  while(rows.length<per)rows.push(null);
  return rows.map(r=>r
    ?'<div class="jm-skill-cell" title="'+esc(STATLABEL(r.k))+': '+esc(r.v)+'"><b>'+esc(STATLABEL(r.k))+'</b><i>'+esc(r.v)+'</i></div>'
    :'<div class="jm-skill-cell"></div>').join('');
}
function jmRenderSkillPage(){
  const g=document.getElementById('jmSkillGrid'),p=document.getElementById('jmPageLabel');
  if(g)g.innerHTML=jmSkillHtml();
  if(p)p.textContent=jmPage+'/'+Math.max(1,Math.ceil(jmStats.length/6));
}
function jmArtKey(s){
  const a=String(s.a||'').replace(/\.json$/,'').replace(/_ni$/,'');
  return a.startsWith('jm_')?a.slice(3):a;
}
function jmIsNi(s){return /_ni(\.json)?$/.test(String(s.a||''));}
function jmAltSkill(s){
  const key=jmArtKey(s), want=jmIsNi(s)?'jm_'+key+'.json':'jm_'+key+'_ni.json';
  return SK.find(x=>x.t==='jingmai'&&x.a===want)||null;
}
function jmTreeHtml(){
  const all=SK.filter(x=>x.t==='jingmai');
  return all.map(x=>'<button type="button" class="jm-tree-item'+(curSet&&curSet.k===x.k?' on':'')+'" data-k="'+x.k+'"'+
    ' title="'+esc(F(x,'n'))+'"><b>'+esc(F(x,'n'))+'</b></button>').join('');
}

const JM_MILESTONES=[36,72,108,144,180,216];
function jmNodeNeed(i,n,max){
  return Math.min(max, JM_MILESTONES[i] || JM_MILESTONES[JM_MILESTONES.length-1]);
}
function jmOpenCount(level,n,max){
  return Array.from({length:n},(_,i)=>jmNodeNeed(i,n,max)).filter(v=>v<=level).length;
}
function jmPointName(a,i){
  const p=(JM_POINT_NAMES[a]||[])[i];
  if(!p)return L('jmNodes')+' '+(i+1);
  return lang==='zh'?(p.z||p.v):p.v;
}
function jmNodesHtml(a,key,ni,level,max){
  const names=JM_POINT_NAMES[a]||[];
  const n=names.length||5;
  // Acupoints open only on the game's 36-level cycle marks (36/72/108/...).
  const open=jmOpenCount(level,n,max);
  const photo=i=>'/jingmai/nw-'+key+'-'+(i<open?'open-'+(ni?'n':'z'):'close')+'.png';
  // Keep the game's circular frame, but split the decals evenly between its
  // left/right arcs: lower tiers on the left, higher tiers on the right.
  const leftCount=Math.ceil(n/2);
  return Array.from({length:n},(_,i)=>{
    const left=i<leftCount;
    const j=left?i:i-leftCount;
    const count=left?leftCount:n-leftCount;
    const y=count===1?50:12+76*j/(count-1);
    // Alternate the inner/outer edge of each half so the doubled decals stay
    // evenly spaced without overlapping, while lower/higher tiers stay left/right.
    const inner=j%2===0;
    const x=left?(inner?34:15):(inner?66:85);
    const nm=jmPointName(a,i);
    const need=jmNodeNeed(i,n,max);
    return '<button type="button" class="jm-node'+(i<open?' on':'')+'"'+
      ' style="left:'+x.toFixed(2)+'%;top:'+y.toFixed(2)+'%"'+
      ' title="'+esc(nm+' · '+(i<open?L('jmOpen'):L('jmClosed'))+' · '+L('jmLevel')+' '+need)+'">'+
      '<img class="jm-node-photo" src="'+photo(i)+'" alt="">'+
      '<span class="jm-node-label"><span class="jm-node-name">'+esc(nm)+'</span>'+
      '<span class="jm-node-state">'+esc(i<open?L('jmOpen'):L('jmClosed'))+'</span></span></button>';
  }).join('');
}
function jmGameHtml(s,cur,lv){
  jmStats=jmStatRows(cur.st);

  const tier=L('tier')(cur.n||curLevel,cur.rm);
  const cost=L('cost')(cur.s||'','');
  const key=jmArtKey(s), ni=jmIsNi(s), art=ni?'_n':'';
  const cycle=curLevel+'/'+max+' '+L('jmCycle');
  const shortcuts=Array.from({length:8},(_,i)=>{
    const n=curLevel-3+i;
    if(n<1||n>max)return '<span class="jm-quick-empty"></span>';
    return '<button type="button" class="jm-quick-btn'+(n===curLevel?' on':'')+'" data-jm-lv="'+n+'"'+
      ' title="'+esc(L('tier')((lv[n-1]||{}).n||n))+'">'+n+'</button>';
  }).join('');
  const qz=JM_TONIC[s.a]||null;
  const bonus=qz?(lang==='zh'?(qz.bz||''):(qz.bv||'')):'';
  const bonusShort=bonus?bonus.split(' · ').map(x=>x.split(' +')[0]).join(' / '):'';
  const tonicTitle=L('jmTonic')+(qz?' · '+(lang==='zh'?(qz.z||qz.v):qz.v):'')+(bonus?'\n'+bonus:'');
  return '<div class="jm-game" id="jmGame"><div class="jm-stage'+(ni?' is-ni':'')+'" id="jmStage">'+
    '<div class="jm-main"><div class="jm-art-layer">'+
      '<div class="jm-main-bg"></div>'+
      '<div class="jm-path-back" style="background-image:url(\'/jingmai/nw-'+key+'-back-on'+art+'.png\')"></div>'+
      '<div class="jm-path-line" style="background-image:url(\'/jingmai/nw-'+key+'-line-on'+art+'.png\')"></div>'+
      '<div class="jm-node-map">'+jmNodesHtml(s.a,key,ni,curLevel,max)+'</div>'+
      '<div class="jm-gate" style="--jm-fill:'+fill+'%"><i class="jm-gate-fill"></i></div>'+
      '<div class="jm-path-name" style="background-image:url(\'/jingmai/nw-'+key+'-name.png\')"></div>'+
      '</div>'+
      '<div class="jm-skill-row">'+
        '<button type="button" class="jm-skill-icon tonic" style="--jm-tonic-art:url(\''+(qz?qz.icon:'/jingmai/nw-qz-icon.png')+'\')" data-jm-toggle="hide-nodes" title="'+esc(tonicTitle)+'"></button>'+
        '<span class="jm-skill-cap tonic"><b>'+esc(L('jmTonic'))+'</b>'+(bonusShort?'<span>'+esc(bonusShort)+'</span>':'')+'</span>'+
        '</div></div></div>'+
    '<div class="jm-detail"><div class="jm-detail-hd"><b>'+esc(tier)+'</b><em>'+esc(ni?L('jmReverse'):L('jmForward'))+' · '+esc(cycle)+'</em><span>'+esc(cost)+'</span></div>'+
      '<div class="jm-detail-grid">'+jmStats.map(r=>'<span><i>'+esc(STATLABEL(r.k))+':</i><b>'+esc(r.v)+'</b></span>').join('')+'</div>'+
      '<div class="jm-skill-grid" id="jmSkillGrid">'+jmSkillHtml()+'</div>'+
      '<div class="jm-skill-pager"><button type="button" id="jmPagePrev" title="'+esc(L('jmPrevPage'))+'">‹</button>'+
        '<span id="jmPageLabel">1/1</span>'+
        '<button type="button" id="jmPageNext" title="'+esc(L('jmNextPage'))+'">›</button></div>'+
      '<div class="jm-quick-levels">'+shortcuts+'</div></div></div>';
}

function levelControls(max){
  return `<div class="level-controls"><label>${esc(L('level'))}</label>`+
    `<button class="lvl-btn" id="lvprev" ${curLevel<=1?'disabled':''}>◀</button>`+
    `<input class="level-input" id="lvin" type="number" min="1" max="${max}" value="${curLevel}">`+
    `<span class="level-max">/ ${max}</span>`+
    `<button class="lvl-btn" id="lvnext" ${curLevel>=max?'disabled':''}>▶</button>`+
    `<input class="lvl-range" id="lvrange" type="range" min="1" max="${max}" value="${curLevel}"></div>`;
}

    const cur=lv[curLevel-1]||{};
    h+=`<div class="elem-line"><strong>${esc(L('source'))}</strong>${esc(F(s,'g'))}</div>`+
       (F(s,'c')?`<p class="wuxia-meta"><span><strong>${esc(L('category'))}</strong>${esc(F(s,'c'))}</span></p>`:'')+`</div>`;
    if(s.sum) h+=`<div class="wuxia-card" style="margin-bottom:16px"><div class="tier-txt">${fmtDesc(F(s,'sum'))}</div></div>`;
    h+=levelControls(Math.max(1,lv.length));
    h+=`<div class="wuxia-card"><i class="ornament tl"></i><i class="ornament tr"></i><i class="ornament bl"></i><i class="ornament br"></i><div class="card-title"><h4>${esc(L('tier')(cur.n||curLevel))}${F(cur,'r')?' · '+esc(F(cur,'r')):''}</h4><span class="cost">${esc(L('cost')(cur.s||'',''))}</span></div>
      <div class="buffer-box"><h5>${esc(L('statsTitle'))}</h5><div class="tier-txt">${fmtStats(cur.st)}</div></div></div>`;
  }
  box.innerHTML=h;
  const prev=document.getElementById('lvprev'),next=document.getElementById('lvnext'),inp=document.getElementById('lvin'),rng=document.getElementById('lvrange');
  const go=n=>{
    const max=s.t==='wuxue'?s.m[curMove].lv.length:lv.length;
    curLevel=Math.max(1,Math.min(max,n));
    if(s.t==='jingmai') jmPage=1;
    renderContent();renderMid(true);
    const box=document.getElementById('content');
    const lc=box.querySelector('.level-controls');
    box.scrollTop=lc?Math.max(0,lc.getBoundingClientRect().top-box.getBoundingClientRect().top+box.scrollTop-8):0;
  };
  if(prev)prev.onclick=()=>go(curLevel-1);
  if(next)next.onclick=()=>go(curLevel+1);
  if(inp)inp.onchange=()=>go(+inp.value||1);
  if(rng)rng.oninput=()=>go(+rng.value);
  if(s.t==='jingmai'){
    const stage=document.getElementById('jmStage'),game=document.getElementById('jmGame');
    if(stage){
      stage.querySelectorAll('[data-jm-toggle]').forEach(b=>b.onclick=()=>{
        const host=b.dataset.jmToggle==='hide-detail'?game:stage;
        if(host)host.classList.toggle(b.dataset.jmToggle);
      });
      game.querySelectorAll('[data-jm-lv]').forEach(b=>b.onclick=()=>go(+b.dataset.jmLv));
      const pgPrev=document.getElementById('jmPagePrev'),pgNext=document.getElementById('jmPageNext');
      if(pgPrev)pgPrev.onclick=()=>{jmPage--;jmRenderSkillPage();};
      if(pgNext)pgNext.onclick=()=>{jmPage++;jmRenderSkillPage();};
      jmRenderSkillPage();
    }
  }
  const st=document.getElementById('statToggle'),sd=document.getElementById('statDetail');
  if(st)st.onclick=()=>{
    sd.hidden=!sd.hidden;
    st.textContent=sd.hidden?L('statShow'):L('statHide');
  };
  const bb=document.getElementById('bonusBtn');
  if(bb){
    const lvArr=s.m[curMove].lv.slice().reverse();
    wireBonus(lvArr[curLevel-1]);
    bb.onclick=()=>{const mask=document.getElementById('bonusMask');if(mask){mask.hidden=false;}};
  }
  const cab=document.getElementById('cmpAddBtn');
  if(cab) cab.onclick=cmpAddCurrent;
}

function openContent(){
  const c=document.getElementById('content');
  if(!c.classList.contains('on')) history.pushState({wx:1},'');
  c.classList.add('on');c.scrollTop=0;
}
function closeContent(){
  const c=document.getElementById('content');
  if(!c.classList.contains('on'))return;
  c.classList.remove('on');
  if(history.state&&history.state.wx) history.back();
}
window.addEventListener('popstate',()=>{document.getElementById('content').classList.remove('on');});

function activateTab(t){
  const b=document.querySelector('.topnav .tabs button[data-t="'+t+'"]');
  if(!b)return;
  curType=t;curGroup='';curSet=null;curMove=0;curLevel=1;
  sidebarQuery='';
  document.querySelectorAll('.topnav .tabs button').forEach(x=>x.classList.toggle('on',x===b));
  const qm=document.getElementById('qmid'); if(qm)qm.value='';
  document.getElementById('content').classList.remove('on');
  resetCats();renderCats();renderMid();renderContent();
}
document.querySelectorAll('.topnav .tabs button').forEach(b=>b.onclick=()=>{
  activateTab(b.dataset.t);
  history.replaceState(history.state,'',location.pathname+location.search+'#'+b.dataset.t);
});
function applyHash(){
  const h=location.hash.slice(1);
  if(['wuxue','neigong','jingmai'].indexOf(h)>=0) activateTab(h);
}
window.addEventListener('hashchange',applyHash);

function setLang(next){
  if(next===lang)return;
  const side=document.getElementById('sidebar'),mid=document.getElementById('midlist'),carea=document.getElementById('carea');
  const ss=side.scrollTop,ms=mid.scrollTop,cs=carea.scrollTop;
  const qc=document.getElementById('qcat'),qcv=qc?qc.value:'';
  lang=next;
  applyStatic();
  renderCats(true,qcv);renderMid(true);renderContent();
  const cm=document.getElementById('cmpMask');
  if(cm&&!cm.hidden) cmpFill();
  side.scrollTop=ss;mid.scrollTop=ms;carea.scrollTop=cs;
}
document.querySelectorAll('#langToggle button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
document.getElementById('themeToggle').onclick=()=>{theme=theme==='dark'?'light':'dark';applyTheme();};

function boot(){
  SK=DATA.skills;IC=DATA.icons;
  applyTheme();applyStatic();wireCompare();
  applyHash();
  resetCats();renderCats();renderMid();renderContent();
  const l=document.getElementById('bootLoader');if(l)l.remove();
}
(async()=>{
  const t=document.getElementById('bootText');
  try{
    const [core,icons,i18n]=await Promise.all(
      ['core','icons','i18n'].map(n=>wxLoad(n).then(v=>wxDecode(v,n)))
    );
    if(t)t.textContent='Đang dựng dữ liệu…';
    DATA=Object.assign({},core,{icons:icons});I18N=i18n;
    await new Promise(r=>setTimeout(r,0));
    boot();
  }catch(e){if(t)t.textContent='Lỗi tải dữ liệu: '+e.message;console.error(e);}
})();
</script>
</body>
</html>
